<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Page Text Extractor</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="app">
    <h1>Page Text</h1>
    <p class="subtitle">Visible text from the current page without code blocks.</p>

    <textarea id="output" readonly placeholder="Loading page text..."></textarea>

    <div class="actions">
      <button id="refreshBtn" type="button">Refresh</button>
      <button id="copyBtn" type="button">Copy</button>
    </div>

    <p id="status" class="status"></p>
  </div>

  <script src="panel.js"></script>
</body>
</html>
